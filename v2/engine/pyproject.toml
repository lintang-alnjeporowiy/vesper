[project]
name = "tpt-engine"
version = "0.1.0"
description = "Engine perhitungan & kontrak data Vesper (TPT Planner v2)"
readme = "README.md"
authors = [
    { name = "lintang-alnjeporowiy", email = "qonquerorhilal@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "pydantic>=2.14.4",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-include = ["../tools/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905"]  # baris panjang diserahkan ke formatter; zip strict diputuskan per kasus

[tool.pytest.ini_options]
testpaths = ["tests"]
# starlette menyarankan httpx2 untuk TestClient; httpx 0.28 tetap berfungsi
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient. is deprecated"]

[tool.ruff.lint.per-file-ignores]
"**/tools/*.py" = ["E702", "E741", "B007"]

[tool.ruff.lint.isort]
known-first-party = ["tpt_engine", "tpt_api"]

[tool.uv.build-backend]
module-name = ["tpt_engine", "tpt_api"]
